<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GESTOR ROJO OFFGRID</title>
<style>
:root{--red:#ff0f23;--black:#080a0d;--card:#121418;--green:#00ff88}
body{background:var(--black);color:#fff;font-family:monospace;margin:0;padding:0 12px 120px}
.header{display:flex;align-items:center;gap:12px;padding:14px;background:#000;border-bottom:2px solid var(--red);border-radius:0 0 16px 16px}
.header img{width:52px;height:52px;border-radius:50%;border:2px solid var(--red);box-shadow:0 0 12px var(--red);object-fit:cover}
.header h1{color:var(--red);font-size:22px;margin:0;letter-spacing:1px;text-shadow:0 0 8px var(--red)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1a3a2a;border:1px solid var(--green);color:#fff;padding:8px 18px;border-radius:20px;z-index:99;display:flex;align-items:center;gap:8px;animation:fadeOut 4s forwards 4s}
@keyframes fadeOut{to{opacity:0;transform:translateX(-50%) translateY(-20px)}}
.card{background:var(--card);border:1px solid #222;border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 0 20px #000 inset}
.field{position:relative;display:flex;align-items:center;background:#0e1013;border:1px solid #2a0a0a;border-radius:10px;margin:8px 0;padding:8px 10px}
.field i{color:var(--red);font-style:normal;margin-right:10px;font-size:18px}
.field input,.field select,.field textarea{flex:1;background:transparent;border:none;color:#fff;outline:none;width:100%}
.field label{position:absolute;top:-8px;left:36px;background:var(--card);padding:0 6px;font-size:11px;color:#aaa}
.btns{display:flex;gap:10px;margin:16px 0}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--red);background:#000;color:#fff;font-weight:bold}
.btn.primary{background:var(--red)}
.btn.ia.active{border-color:var(--green);color:var(--green);box-shadow:0 0 10px var(--green)}
#terminal{display:none;background:#000;border:1px solid var(--green);border-radius:12px;padding:12px;color:var(--green);min-height:220px;font-size:14px;box-shadow:0 0 15px #003300 inset}
#terminal p{margin:4px 0}
.cursor{animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.drawer{background:#fff;color:#000;border-radius:18px;padding:14px;margin-top:10px}
.fingerprint{text-align:center;margin-top:20px}
.fingerprint .print{width:70px;height:70px;margin:auto;background:radial-gradient(circle,var(--red),transparent);border-radius:50%;filter:drop-shadow(0 0 12px var(--red));display:grid;place-items:center;font-size:36px}
</style>
</head>
<body>
<div class="header">
<img src="icon.png" alt="logo">
<h1>GESTOR ROJO OFFGRID</h1>
</div>
<div id="toast" class="toast">✅ Equipo Detectado: 8GB RAM - Potencial IA: ALTO</div>

<div id="formCard" class="card">
<div class="field"><i>👤</i><label>Nombre</label><input id="nombre" placeholder="Ingresa el nombre"></div>
<div class="field"><i>📍</i><label>Direccion</label><input id="direccion" placeholder="Calle, colonia, ciudad"></div>
<div class="field"><i>📞</i><label>Telefono</label><input id="telefono" placeholder="+52 55 1234 5678"></div>
<div class="field"><i>✉️</i><label>Correo</label><input id="correo" placeholder="correo@ejemplo.local"></div>
<div class="field"><i>🛰️</i><label>GPS</label><input id="gps" placeholder="19.4326, -99.1332"></div>
<div class="field"><i>📝</i><label>Etc</label><input id="etc" placeholder="Notas adicionales..."></div>
<div class="field"><i>🏦</i><label>CLABE</label><input id="clabe" placeholder="012 180 00123456789 0"></div>
<div class="field"><i>🏷️</i><label>Tipo</label>
<select id="tipo"><option>CLIENTES</option><option>Clientes</option><option>Pacientes</option><option>Proveedores</option><option>CONTACTOS PRIVADO 🔒</option></select></div>
</div>

<div id="terminal">
<p>>_ TERMINAL • IA OFFGRID</p>
<p>> IA OFFGRID iniciada...</p>
<p id="iaOut">> Esperando comando..<span class="cursor">█</span></p>
<input id="iaInput" style="width:100%;background:#000;border:none;color:var(--green);outline:none" placeholder="Escribe: busca Juan...">
</div>

<div class="btns">
<button class="btn" onclick="ver()">👁️ Ver</button>
<button class="btn primary" onclick="guardar()">⬇️ Guardar</button>
<button id="btnIA" class="btn ia" onclick="toggleIA()">🧠 IA</button>
</div>

<div class="drawer">
<b>DATOS GUARDADOS</b>
<div id="lista" style="margin-top:8px;font-size:13px"></div>
</div>

<div class="fingerprint">
<div class="print">🧬</div>
<small style="color:var(--red)">AUTENTICACIÓN BIOMÉTRICA ACTIVA</small>
</div>

<script>
setTimeout(()=>{document.getElementById('toast').style.display='none'},4500);
let iaOn=false;
function toggleIA(){
iaOn=!iaOn;
document.getElementById('formCard').style.display=iaOn?'none':'block';
document.getElementById('terminal').style.display=iaOn?'block':'none';
document.getElementById('btnIA').classList.toggle('active',iaOn);
if(iaOn) document.getElementById('iaInput').focus();
}
function guardar(){
let d={nombre:nombre.value,telefono:telefono.value,tipo:tipo.value,ts:new Date().toLocaleTimeString()};
let arr=JSON.parse(localStorage.getItem('gestor')||'[]');arr.push(d);localStorage.setItem('gestor',JSON.stringify(arr));ver();
}
function ver(){
let arr=JSON.parse(localStorage.getItem('gestor')||'[]');
lista.innerHTML=arr.map((r,i)=>`✅ Registro #${100+i} — ${r.nombre} — ${r.tipo} — guardado ${r.ts}`).join('<br>');
}
document.getElementById('iaInput').addEventListener('keydown',e=>{
if(e.key==='Enter'){
let q=e.target.value.toLowerCase();
let arr=JSON.parse(localStorage.getItem('gestor')||'[]');
let res=arr.filter(x=>x.nombre.toLowerCase().includes(q));
document.getElementById('iaOut').innerHTML=`> Usuario: ${e.target.value}<br>> IA: Encontrado ${res.length} registro(s)...<br>${res.map(r=>`> - ${r.nombre} | ${r.telefono}`).join('<br>')}<br><span class=cursor>█</span>`;
e.target.value='';
}
});
ver();
</script>
</body>
</html>
