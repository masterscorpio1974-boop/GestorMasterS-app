<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GESTOR ROJO</title><style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:12px}
.logo{width:120px;height:120px;border-radius:50%;display:block;margin:15px auto;border:3px solid red;box-shadow:0 0 30px red;object-fit:cover}
.titulo{color:red;text-align:center;font-size:32px;font-weight:900;line-height:1.1}
.sub{color:red;text-align:center;font-size:12px;margin:10px 0 15px 0;font-weight:bold}
.box{background:#0f0f0f;border-radius:20px;padding:14px}
input{width:100%;padding:15px;margin:6px 0;background:#1e1e1e;color:#fff;border:none;border-radius:12px;box-sizing:border-box}
.btn-rojo{width:100%;padding:16px;background:red;color:#000;font-weight:900;border:none;border-radius:12px;margin-top:10px}
.btn{width:100%;padding:13px;background:#222;color:#fff;border:none;border-radius:12px;margin:6px 0}
#status{color:#0f0;margin-top:10px;font-size:13px}#lista{color:#ccc;white-space:pre-wrap;margin-top:8px}
</style></head><body>
<img src="icon.png" class="logo">
<div class="titulo">GESTOR ROJO<br>OFFGRID</div>
<div class="sub">SIN INTERNET - SIN GOOGLE - 100% LOCAL</div>
<div class="box">
<div style="color:red;font-weight:bold;margin-bottom:8px">CLIENTES OFFGRID</div>
<input id="c1" placeholder="1. Nombre">
<input id="c2" placeholder="2. Direccion">
<input id="c3" placeholder="3. Phone">
<input id="c4" placeholder="4. Correo">
<input id="c5" placeholder="5. Ubicacion GPS">
<input id="c6" placeholder="6. Etc">
<button class="btn-rojo" onclick="guardar()">GUARDAR CLIENTE OFFGRID</button>
<button class="btn" onclick="ver()">Ver Todo</button>
<button class="btn" onclick="backup()">Backup .json</button>
<div id="status">Cargando...</div><div id="lista"></div></div>
<script>
let db=[];const KEY='rojo_v100_final';
function init(){try{db=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){db=[]} document.getElementById('status').innerText='DB ROJA OK: '+db.length+' clientes';}
function guardar(){
let n=document.getElementById('c1').value.trim();if(!n){alert('Pon nombre');return;}
db.push({nombre:n,direccion:document.getElementById('c2').value,phone:document.getElementById('c3').value,correo:document.getElementById('c4').value,gps:document.getElementById('c5').value,etc:document.getElementById('c6').value,fecha:new Date().toLocaleString()});
localStorage.setItem(KEY,JSON.stringify(db));
document.getElementById('c1').value='';document.getElementById('c2').value='';document.getElementById('c3').value='';document.getElementById('c4').value='';document.getElementById('c5').value='';document.getElementById('c6').value='';
document.getElementById('status').innerText='GUARDADO: '+n+' | Total: '+db.length;
ver();
}
function ver(){let lista=document.getElementById('lista');if(db.length==0){lista.innerText='\nSin registros';return;}lista.innerText=db.map((c,i)=>`${i+1}. ${c.nombre} | ${c.direccion} | ${c.phone}`).join('\n');document.getElementById('status').innerText='MOSTRANDO '+db.length;}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([localStorage.getItem(KEY)||'[]'],{type:'application/json'}));a.download='backup.json';a.click();}
document.addEventListener('DOMContentLoaded',init);
</script></body></html>
