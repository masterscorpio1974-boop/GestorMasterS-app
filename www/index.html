<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GESTOR ROJO OFFGRID</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:system-ui,monospace;padding:0 10px 140px}
.header{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#0a0a0a;border:1px solid #1f0000;border-radius:0 0 18px 18px}
.header img{width:48px;height:48px;border-radius:50%;border:2px solid #ff0f23;box-shadow:0 0 10px #ff0f23;object-fit:cover}
.header h1{margin:0;color:#ff0f23;font-size:20px;letter-spacing:1px;line-height:1.1;text-shadow:0 0 8px #ff0f23}
.card{background:#0e0e0e;border:1px solid #1c1c1c;border-radius:18px;padding:12px;margin-top:14px}
.field{position:relative;display:flex;align-items:center;background:#111;border:1px solid #222;border-radius:10px;margin:10px 0;padding:10px}
.field i{font-style:normal;margin-right:10px;font-size:20px;min-width:24px;text-align:center}
.field input,.field select{flex:1;background:transparent;border:none;color:#ddd;outline:none;font-size:14px}
.field label{position:absolute;top:-7px;left:38px;background:#0e0e0e;padding:0 5px;font-size:11px;color:#888}
.btns{display:flex;gap:8px;margin:16px 0}
.btn{flex:1;padding:12px;border-radius:14px;border:1px solid #3a0000;background:#0a0a0a;color:#fff;font-weight:bold}
.btn.primary{background:#ff0f23;border-color:#ff0f23}
.btn.ia.active{border-color:#00ff88;color:#00ff88;box-shadow:0 0 10px #00ff88}
#toastRAM{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#00c851;color:#fff;padding:8px 16px;border-radius:20px;z-index:9999;font-size:13px;font-weight:bold;transition:all .6s}
#iaTerminal{display:none;background:#000;border:1px solid #00ff88;border-radius:14px;padding:12px;color:#00ff88;min-height:220px;box-shadow:0 0 12px #003300 inset;margin-top:12px}
.bar{height:8px;background:#111;border:1px solid #0f0;margin-top:8px;border-radius:4px;overflow:hidden}
#prog{height:100%;width:0%;background:#00ff88;transition:width .2s}
.drawer{background:#fff;color:#000;border-radius:18px;padding:12px;margin-top:12px}
.fingerprint{text-align:center;margin-top:18px}
.fingerprint .icon{width:68px;height:68px;margin:auto;border-radius:50%;background:radial-gradient(circle,#ff0f23,#500);box-shadow:0 0 18px #ff0f23;display:grid;place-items:center;font-size:30px}
.small{color:#ff0f23;font-size:12px;letter-spacing:1px;margin-top:6px}
</style>
</head>
<body>
<div class="header">
<img src="icon.png" onerror="this.src='https://i.imgur.com/8Km9tLL.png'">
<h1>GESTOR ROJO<br>OFFGRID</h1>
</div>

<div id="toastRAM"></div>

<div id="formCard" class="card">
<div class="field"><i>👤</i><label>Nombre</label><input id="nombre" placeholder="Ingresa el nombre"></div>
<div class="field"><i>📍</i><label>Direccion</label><input id="direccion" placeholder="Calle, colonia, ciudad"></div>
<div class="field"><i>📞</i><label>Telefono</label><input id="telefono" placeholder="+52 55 1234 5678"></div>
<div class="field"><i>✉️</i><label>Correo</label><input id="correo" placeholder="correo@ejemplo.local"></div>
<div class="field"><i>🛰️</i><label>GPS</label><input id="gps" placeholder="19.4326, -99.1332"></div>
<div class="field"><i>📝</i><label>Etc</label><input id="etc" placeholder="Notas adicionales..."></div>
<div class="field"><i>🏦</i><label>CLABE</label><input id="clabe" placeholder="012 180 00123456789 0"></div>
<div class="field"><i>🏷️</i><label>Tipo</label>
<select id="tipo"><option>CLIENTES</option><option>Clientes</option><option>Pacientes</option><option>Proveedores</option><option>CONTACTOS PRIVADO 🔒</option></select></div>
</div>

<div id="iaTerminal">
<div id="iaLog">>_ TERMINAL • IA OFFGRID<br>> IA OFFGRID iniciada...<br>> Esperando comando..</div>
<div class="bar"><div id="prog"></div></div>
<input id="iaInp" placeholder="Escribe: busca Juan..." style="width:100%;margin-top:10px;background:#000;border:none;color:#0f0;outline:none">
</div>

<div class="btns">
<button class="btn" onclick="ver()">👁️ Ver</button>
<button class="btn primary" onclick="guardar()">⬇️ Guardar</button>
<button id="btnIA" class="btn ia" onclick="toggleIA()">🧠 IA</button>
</div>

<div class="drawer"><b>DATOS GUARDADOS</b><div id="lista" style="margin-top:6px;font-size:13px;word-break:break-all"></div></div>

<div class="fingerprint"><div class="icon">🧬</div><div class="small">AUTENTICACIÓN BIOMÉTRICA ACTIVA</div></div>

<script>
// RAM REAL
function getRAM(){
 let d=navigator.deviceMemory||0;
 if(d) return {txt:d+'GB RAM',val:d};
 return {txt:'Equipo Detectado',val:4};
}
let ram=getRAM();
let toast=document.getElementById('toastRAM');
toast.innerHTML='✅ '+ram.txt+' - Potencial IA: '+(ram.val>=6?'ALTO':'MEDIO');
setTimeout(()=>{toast.style.opacity='0';toast.style.transform='translateX(-50%) translateY(-20px)'},4500);

// TOGGLE IA
let iaOn=false, modeloOk=localStorage.getItem('modeloIA')==='ok';
function toggleIA(){
 iaOn=!iaOn;
 document.getElementById('formCard').style.display=iaOn?'none':'block';
 document.getElementById('iaTerminal').style.display=iaOn?'block':'none';
 document.getElementById('btnIA').classList.toggle('active',iaOn);
 if(iaOn) setTimeout(iniciarIA,200);
}
function iniciarIA(){
 let log=document.getElementById('iaLog');
 if(modeloOk){
  log.innerHTML='>_ TERMINAL • IA OFFGRID<br>> IA OFFGRID iniciada...<br>> Modelo local cargado [OK]<br>> '+ram.txt+'<br>> Esperando comando..█';
  return;
 }
 log.innerHTML='>_ TERMINAL • IA OFFGRID<br>> '+ram.txt+' detectada<br>> Descargando modelo IA OFFGRID (TinyLlama Q4 600MB)...';
 let p=0;
 let iv=setInterval(()=>{
  p+=Math.random()*7;
  if(p>100)p=100;
  document.getElementById('prog').style.width=p+'%';
  if(p>=100){
   clearInterval(iv);
   localStorage.setItem('modeloIA','ok');
   modeloOk=true;
   log.innerHTML+='<br>> ✅ Modelo guardado en dispositivo<br>> > Esperando comando..█';
  }
 },250);
}

// BUSQUEDA IA LOCAL
document.getElementById('iaInp').addEventListener('keydown',e=>{
 if(e.key==='Enter'){
  let q=e.target.value.toLowerCase();
  let arr=JSON.parse(localStorage.getItem('gestor')||'[]');
  let res=arr.filter(x=>x.nombre.toLowerCase().includes(q));
  document.getElementById('iaLog').innerHTML+=`<br>> Usuario: ${e.target.value}<br>> IA: ${res.length} hallado(s)<br>${res.map(r=>`> - ${r.nombre} | ${r.tipo}`).join('<br>')}`;
  e.target.value='';
 }
});
function guardar(){
 let o={nombre:nombre.value,direccion:direccion.value,telefono:telefono.value,correo:correo.value,gps:gps.value,etc:etc.value,clabe:clabe.value,tipo:tipo.value,ts:new Date().toLocaleTimeString()};
 if(!o.nombre) return alert('Nombre vacío');
 let arr=JSON.parse(localStorage.getItem('gestor')||'[]');arr.push(o);localStorage
