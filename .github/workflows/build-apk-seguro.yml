
name: Compile GestorMasterS DEFINITIVO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev

      - name: Instalar Buildozer y Cython compatibles
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.1.0" buildozer python-for-android

      - name: Aceptar licencias Android
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          yes | buildozer android adb -- --help || true

      - name: Compilar APK
        run: |
          buildozer android debug --log-level 2

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS-APK-FINAL
          path: bin/*.apk
