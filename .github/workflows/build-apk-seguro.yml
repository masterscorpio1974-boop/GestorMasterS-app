name: Compile GestorMasterS DEFINITIVO
run-name: Build ${{ github.actor }} · ${{ github.sha }}

on:
  workflow_dispatch

env:
  ANDROID_SDK_LICENSE_ACCEPTED: true
  CI: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y zip unzip build-essential libffi-dev libssl-dev
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36 python-for-android==2024.9.9

      - name: Build APK
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | buildozer android debug --no-warmup

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS-APK-FINAL
          path: bin/*.apk
