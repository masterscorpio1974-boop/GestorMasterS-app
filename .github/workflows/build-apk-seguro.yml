name: Compilar GestorMasterS DEFINITIVO
run-name: Construyendo GestorMasterS · ${{ github.sha }}

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_UNSECURE_NODE_VERSION: true
  ANDROID_SDK_LICENSE_ACCEPTED: true
  CI: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📥 Obtener todo el código
        uses: actions/checkout@v4

      - name: 🛠️ Preparar Python exacto
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: ☕ Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Instalar todas las dependencias
        run: |
          sudo apt update -y
          sudo apt install -y zip libz-dev libffi-dev libssl-dev autoconf automake libtool pkg-config
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==2024.9.9 cython==0.29.36

      - name: 🧹 Limpiar cachés antiguas
        run: |
          rm -rf .buildozer || true
          rm -rf bin || true

      - name: 🚀 Iniciar compilación
        run: buildozer android debug --no-warmup --verbose

      - name: 📤 Subir APK lista
        uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS-APK-Oficial
          path: bin/*.apk
          if-no-files-found: error
