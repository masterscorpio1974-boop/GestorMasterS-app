name: Compilar GestorMasterS DEFINITIVO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código más reciente
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar paquetes del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk wget

      - name: Instalar Buildozer y componentes
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Compilar APK con registro completo
        run: |
          sudo apt-get install -y autoconf automake libtool pkg-config
          buildozer android debug --log-level 2

      - name: Guardar APK final
        uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS-APK-DEFINITIVO
          path: bin/*.apk
