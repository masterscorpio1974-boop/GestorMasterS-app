name: Build APK DEFINITIVO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # 1. CACHÉ DE BUILDOZER Y ANDROID SDK/NDK
      - name: Cache Buildozer packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # 2. FIJAR EXACTAMENTE Python 3.10
      - name: Python EXACTO 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Instalar herramientas sistema
      - name: Dependencias
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libc6-dev libbz2-dev

      # 4. INSTALAR VERSIONES REQUERIDAS
      - name: Versiones EXACTAS iguales al spec
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.37 buildozer==1.5.0 kivy==2.3.0

      # 5. Compilación Limpia directa
      - name: Compilar Limpio
        run: |
          buildozer android debug --clean

      # 6. Subir APK resultante
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorMaster_SIN_GOOGLE
          path: bin/*.apk
