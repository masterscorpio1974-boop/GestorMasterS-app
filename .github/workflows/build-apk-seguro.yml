name: Compile GestorMasterS DEFINITIVO
run-name: Build ${{ github.actor }} · ${{ github.sha }}

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_UNSECURE_NODE_VERSION: true
  PYTHONIOENCODING: utf-8
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_LICENSE_ACCEPTED: true
      CI: true
    steps:
      - name: Eliminar cachés y restos viejos
        run: |
          rm -rf ~/.buildozer
          rm -rf ~/.cache/pip
          rm -rf .buildozer

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Python EXACT 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Instalar paquetes del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get full-upgrade -y
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config libssl-dev libffi-dev cmake ninja-build

      - name: Instalar versiones exactas existentes
        run: |
          python -m pip install --upgrade pip setuptools wheel packaging
          pip install buildozer==2.0.0 cryptography==49.0.1 python-for-android==2024.10.9

      - name: Aplicar todos los parches
        run: |
          sed -i 's/if not self.buildozer.file_exists("\/usr\/include\/zlib.h"):/if False: # PARCHADO/g' ~/.local/lib/python*/site-packages/buildozer/targets/android.py
          sed -i 's/if not buildops.file_exists("\/usr\/include\/zlib.h"):/if False: # PARCHADO/g' ~/.local/lib/python*/site-packages/buildozer/targets/android.py

          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools
          ln -sf /usr/local/lib/android/sdk/build-tools/30.0.3 ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0 || true

          sed -i 's/zip -r /zip -rq /g' ~/.local/lib/python*/site-packages/buildozer/targets/android.py
          sed -i 's/subprocess.call(\[\"zip\"/subprocess.call(\[\"zip\", \"-q\"/g' ~/.local/lib/python*/site-packages/buildozer/targets/android.py
          stty sane 2>/dev/null || true

      - name: Ejecutar compilación completa
        run: |
          buildozer android debug --no-warmup --log-level 2

      - name: Subir APK final
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GestorMasterS-APK-FINAL
          path: bin/*.apk
