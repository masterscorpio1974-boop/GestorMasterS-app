name: Build APK DEFINITIVO
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip build-essential libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --user Cython==0.29.36 virtualenv
          pip install --user buildozer
          echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV

      - name: Limpiar caché vieja
        run: rm -rf .buildozer bin __pycache__

      - name: Compilar APK
        run: yes | buildozer android debug --verbose

      - name: Subir APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GestorMasterS-APK-FINAL
          path: bin/*.apk
