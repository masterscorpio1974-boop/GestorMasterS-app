name: Compile GestorMasterS DEFINITIVO AZUL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 1. Configuración de Python idéntica a tu captura
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 2. Configuración de Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Instalación de dependencias del sistema simplificadas
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y unzip zip libffi-dev libssl-dev autoconf automake libtool
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      # 4. Limpieza clásica de caché
      - name: Clean old cache
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -rf ./.bin || true

      # 5. Compilación con la instrucción 'yes |'
      - name: Build APK
        run: |
          yes | buildozer android debug

      # 6. Carga del artefacto final
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS-APK-AZUL-CRISTAL
          path: bin/*.apk
          if-no-files-found: error
