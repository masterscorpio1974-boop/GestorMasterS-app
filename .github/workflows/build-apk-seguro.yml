name: Compilar GestorMasterS DEFINITIVO
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 17 (ESTO ERA LO QUE FALTABA)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool pkg-config zlib1g-dev libncursesw5-dev libffi-dev libssl-dev

      - name: Instalar Buildozer y P4A
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36 python-for-android==2024.01.21

      - name: Aplicar parches para libffi y libzlib
        run: |
          RECIPES_DIR=$(python3 -c "import pythonforandroid.recipes; import os; print(os.path.dirname(pythonforandroid.recipes.__file__))")
          sed -i 's/^if not exists_zlib:/# if not exists_zlib:/' "$RECIPES_DIR/libzlib/__init__.py" || true
          sed -i 's/^.*raise SystemExit(1)/# raise SystemExit(1)/' "$RECIPES_DIR/libzlib/__init__.py" || true

      - name: Compilar APK
        run: |
          buildozer android debug --log-level 2

      - name: Guardar APK final
        uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS-APK-DEFINITIVO
          path: bin/*.apk
          retention-days: 90
