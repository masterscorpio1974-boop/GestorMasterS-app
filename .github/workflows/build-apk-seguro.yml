name: Build APK DEFINITIVO
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11.9 IGUAL AL SPEC
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Java 17 Requerido
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar todo lo necesario
        run: |
          sudo apt update -y
          sudo apt install -y zip unzip build-essential libffi-dev libssl-dev autoconf automake libtool
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Limpiar basura anterior
        run: rm -rf .buildozer bin __pycache__

      - name: Compilar YA
        run: buildozer android debug --no-warmup --verbose

      - name: Subir APK listo
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GestorMasterS-APK-LIBRE-DE-ERRORES
          path: bin/*.apk
