name: Build GESTOR ROJO Capacitor OFFGRID

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm install
          npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK ROJO
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK ROJO OFFGRID
        uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS-ROJO-APK-OFFGRID
          path: android/app/build/outputs/apk/debug/app-debug.apk
