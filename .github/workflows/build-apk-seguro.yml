name: Build APK DEFINITIVO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # Java 17 era indispensable en ese flujo clásico
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libc6-dev libbz2-dev

      # Forzamos las herramientas clásicas estables que no piden licencias trabadas
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.33 buildozer==1.2.0 kivy==2.1.0

      - name: Clean old cache
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      # Compilación directa como lo hacía el flujo #68
      - name: Build APK
        run: |
          buildozer android debug

      # Sube el archivo binario generado
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorMaster_SIN_GOOGLE
          path: bin/*.apk
