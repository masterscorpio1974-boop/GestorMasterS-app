name: Build APK DEFINITIVO
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip build-essential libffi-dev libssl-dev autoconf automake libtool
          sudo apt-get install -y pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo-dev cmake
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install Cython==0.29.36
          python -m pip install buildozer

      - name: Restaurar caché
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            bin
          key: buildozer-cache-${{ github.sha }}
          restore-keys: |
            buildozer-cache-

      - name: Limpiar caché vieja
        run: rm -rf .buildozer bin __pycache__

      - name: Compilar APK
        run: yes | buildozer android debug --verbose

      - name: Subir APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GestorMasterS-APK-FINAL
          path: bin/*.apk
