name: Compilar GestorMasterS DEFINITIVO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_UNSECURE_NODE_VERSION: true
    steps:
      - name: Obtener código más reciente
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar TODAS las herramientas de compilación
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk wget autoconf automake libtool pkg-config

      - name: Instalar Buildozer y componentes
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Compilar APK sin errores de libffi
        run: |
          buildozer android debug --log-level 2

      - name: Guardar APK final
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GestorMasterS-APK-DEFINITIVO
          path: bin/*.apk
