name: Compile GestorMasterS
run-name: Build ${{ github.actor }} · ${{ github.sha }}

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_LICENSE_ACCEPTED: true
      CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get full-upgrade -y
          sudo apt-get install -y zip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libssl-dev libffi-dev cmake

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cryptography

      - name: Create directories
        run: |
          mkdir -p DATA BACKUPS GENERATED_FILES TEMP DOCS CODIGO
          chmod 700 DATA BACKUPS
          chmod 755 GENERATED_FILES TEMP DOCS CODIGO

      - name: Apply all build fixes
        run: |
          cat > /tmp/fix.py << 'ENDOFFIX'
import sys
import os
import pathlib
import glob
import shutil

PY_LIB = sys.prefix + "/lib/python3.11/site-packages"

for target in [
    os.path.join(PY_LIB, "buildozer", "targets", "android.py"),
    os.path.join(PY_LIB, "pythonforandroid", "recipes", "libzlib", "__init__.py")
]:
    p = pathlib.Path(target)
    if p.exists():
        t = p.read_text()
        t = t.replace("if not self.buildozer.file_exists('/usr/include/zlib.h'):", "if False:")
        t = t.replace("if not buildops.file_exists('/usr/include/zlib.h'):", "if False:")
        t = t.replace("raise SystemExit(1)", "pass")
        p.write_text(t)
print("ZLIB FIXED")

p = pathlib.Path(os.path.join(PY_LIB, "buildozer", "targets", "android.py"))
if p.exists():
    t = p.read_text()
    t = t.replace("raise SystemError('Unsupported platform: {0}'.format(platform))", "print('PLATFORM CHECK SKIPPED')")
    t = t.replace("if platform not in ('linux', 'darwin', 'win32'):", "if False and platform not in ('linux', 'darwin', 'win32'):")
    t = t.replace('if platform not in ("linux", "darwin", "win32");', 'if False and platform not in ("linux", "darwin", "win32"):')
    t = t.replace("def _install_android_ndk(self):", "def _install_android_ndk(self):\n        platform = 'linux'")
    t = t.replace("def _install_android_sdk(self):", "def _install_android_sdk(self):\n        platform = 'linux'")
    p.write_text(t)
print("PLATFORM FIXED")

t = p.read_text()
old_path = 'sdkmanager_path = join(self._platform_dir, "android-sdk", "tools", "bin", "sdkmanager")'
new_path = 'sdkmanager_path = join(self._platform_dir, "android-sdk", "cmdline-tools", "latest", "bin", "sdkmanager")\n        import os\n        if not os.path.exists(sdkmanager_path):\n            sdkmanager_path = join(self._platform_dir, "android-sdk", "cmdline-tools", "bin", "sdkmanager")\n        if not os.path.exists(sdkmanager_path):\n            sdkmanager_path = join(self._platform_dir, "android-sdk", "tools", "bin", "sdkmanager")'
t = t.replace(old_path, new_path)
p.write_text(t)
print("SDKMANAGER PATHS FIXED")

p = pathlib.Path(os.path.join(PY_LIB, "buildozer", "__init__.py"))
if p.exists():
    t = p.read_text()
    new_block = """try:
    from urllib.request import FancyURLopener
except ImportError:
    import urllib.request
    class FancyURLopener:
        def retrieve(self, url, filename=None, *a, **k):
            return urllib.request.urlretrieve(url, filename)
        def urlretrieve(self, url, filename=None, *a, **k):
            return urllib.request.urlretrieve(url, filename)
    URLopener = FancyURLopener"""
    if "from urllib.request import FancyURLopener" in t:
        t = t.replace("from urllib.request import FancyURLopener", new_block)
    p.write_text(t)
print("DOWNLOAD FIXED")

for root, dirs, files in os.walk(PY_LIB):
    if "__pycache__" in dirs:
        shutil.rmtree(os.path.join(root, "__pycache__"), ignore_errors=True)
print("CACHE CLEANED")
print("ALL PATCHES APPLIED")
ENDOFFIX
          python3 /tmp/fix.py

      - name: Build APK
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/CODIGO
        run: buildozer android debug --no-warmup --verbose

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GestorMasterS-Universal-v1.0.0
          path: bin/*.apk
          retention-days: 90
