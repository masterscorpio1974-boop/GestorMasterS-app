name: Compile GestorMasterS DEFINITIVO
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11.9'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y unzip zip libffi-dev libssl-dev autoconf automake libtool
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Clean old cache
        run: |
          rm -rf.buildozer
          rm -rf./bin
          rm -rf bin || true
      - name: Build APK
        run: |
          yes | buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS-APK
          path: bin/*.apk
          if-no-files-found: error
