name: Build APK - Gestor Master S
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer==1.5.0 Cython==0.29.36
      - name: Build APK (1st pass to download SDK)
        run: |
          buildozer -v android debug || true
      - name: Accept licenses and force install 33.0.2
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $SDK/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          ls $SDK/build-tools/
      - name: Build APK (real)
        run: |
          buildozer -v android debug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: APK-GestorMasterS
          path: bin/*.apk
