name: Build APK - Gestor Master S
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android NDK r25b
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25b
          link-to: true

      - name: Instalar paquetes del sistema
        run: |
          sudo apt update -y
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev

      - name: Instalar Buildozer y Cython exactos
        run: |
          pip install --upgrade pip setuptools wheel
          pip install cython==0.29.37 buildozer

      - name: ✅ Aceptar licencias SDK ANTES de compilar
        run: |
          mkdir -p ~/.android/sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2811b00b87329" > ~/.android/sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c9f346d8abd" > ~/.android/sdk/licenses/android-sdk-preview-license

      - name: Limpiar compilaciones viejas y compilar
        run: |
          rm -rf .buildozer bin
          buildozer android debug

      - name: Subir APK final
        uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS_v2_OFFGRID_COMPLETO
          path: bin/*.apk
