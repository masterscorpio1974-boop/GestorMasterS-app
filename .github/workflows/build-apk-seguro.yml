name: Build APK - Gestor Master S
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK 25b
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25b
          link-to: true

      - name: Instalar todo lo necesario
        run: |
          sudo apt update -y
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install cython==0.29.37 buildozer

      - name: Limpiar y compilar
        run: |
          rm -rf .buildozer bin
          buildozer android debug

      - name: Subir APK listo
        uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS-COMPLETO
          path: bin/*.apk
