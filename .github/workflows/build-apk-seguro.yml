name: Compile GestorMasterS DEFINITIVO AZUL
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev cmake aidl
          pip install --upgrade pip
          pip install buildozer cython
      - name: Accept Licenses y Symlink AIDL
        run: |
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          echo -e "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c38d32490fd50f" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools/37.0.0
          ln -sf /usr/bin/aidl /home/runner/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl || true
          ln -sf /usr/bin/aidl /home/runner/.buildozer/android/platform/android-sdk/build-tools/33.0.2/aidl || true
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools/33.0.2
          ln -sf /usr/bin/aidl /home/runner/.buildozer/android/platform/android-sdk/build-tools/33.0.2/aidl || true
      - name: Clean old cache
        run: |
          rm -rf -- bin __pycache__ || true
      - name: Build APK
        run: |
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS-APK-AZUL-CRISTAL
          path: bin/*.apk
