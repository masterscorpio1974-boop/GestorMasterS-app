name: Build APK DEFINITIVO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # 1. CACHÉ DE BUILDOZER Y ANDROID SDK/NDK
      - name: Cache Buildozer packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # 2. LO PRIMERO: ACEPTAR LICENCIAS (Mejorado de forma automática)
      - name: Licencias ya aceptadas
        run: |
          rm -rf ~/.android
          mkdir -p ~/.android/sdk/licenses
          echo "24333f8a63b6825ea9c5514f834c201a934d4ca2" > ~/.android/sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c9134d5a34d" > ~/.android/sdk/licenses/android-sdk-preview-license
          # Forzar aceptación global de licencias de Android por si Buildozer descarga herramientas nuevas
          yes | sdkmanager --licenses || true

      # 3. FIJAR EXACTAMENTE Python 3.10, NI UNO MÁS NI MENOS
      - name: Python EXACTO 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 4. Instalar herramientas sistema
      - name: Dependencias
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libc6-dev libbz2-dev

      # 5. INSTALAR EXACTAMENTE LO QUE DICE TU .spec ANTES DE LLAMAR A BUILDOZER
      - name: Versiones EXACTAS iguales al spec
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.37 buildozer==1.5.0 kivy==2.3.0

      # 6. Compilar --clean para que no use nada viejo
            # 6. Compilar --clean para que no use nada viejo
      - name: Compilar Limpio
        run: |
          export BUILDOZER_ALLOW_ORG_AND_USER_SUDO=1
          buildozer android debug --clean
        env:
          uses-android-sdk-licenses: 1


      # 7. Subir APK
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorMaster_SIN_GOOGLE
          path: bin/*.apk
