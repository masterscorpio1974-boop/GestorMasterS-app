name: Compile GestorMasterS DEFINITIVO
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y zip unzip build-essential libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Pre-install SDK fix Salsa
        run: |
          export SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_ROOT/cmdline-tools
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p $SDK_ROOT/cmdline-tools/latest
          mv cmdline-tools/* $SDK_ROOT/cmdline-tools/latest/
          # EL TRUCO SALSA: crear el path viejo que pide buildozer
          mkdir -p $SDK_ROOT/tools/bin
          cp -r $SDK_ROOT/cmdline-tools/latest/bin/* $SDK_ROOT/tools/bin/
          cp -r $SDK_ROOT/cmdline-tools/latest/lib $SDK_ROOT/tools/ 2>/dev/null || true
          chmod +x $SDK_ROOT/tools/bin/sdkmanager
          yes | $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0" "build-tools;37.0.0" "platforms;android-36" "platform-tools" || true

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS-APK-Android16-API36
          path: bin/*.apk
