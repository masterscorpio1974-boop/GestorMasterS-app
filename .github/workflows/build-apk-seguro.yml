name: Compilar GestorMasterS - Versión Universal Segura
run-name: Compilando ${{ github.actor }} · v${{ github.sha }}

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_LICENSE_ACCEPTED: true
      CI: true
    steps:
      - name: 📥 Obtener todo el código
        uses: actions/checkout@v4

      - name: 🛠️ Preparar Python y entorno
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar todas las herramientas oficiales
        run: |
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y zip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libssl-dev libffi-dev cmake
          python -m pip install --upgrade pip setuptools wheel buildozer cryptography

      - name: 📂 Crear estructura segura
        run: |
          mkdir -p BASE_DE_DATOS RESPALDOS ARCHIVOS_GENERADOS TEMPORAL DOCS CODIGO
          chmod 700 BASE_DE_DATOS RESPALDOS
          chmod 750 ARCHIVOS_GENERADOS TEMPORAL

      - name: 🩹 Aplicar TODOS los parches adaptados
        run: |
          # Pegamos aquí el código completo de arriba, o lo guardamos como archivo
          cat > aplicar_parches.py << 'PYEOF'
          [PEGA AQUÍ TODO EL CÓDIGO DE ARRIBA DE LOS PARCHES]
          PYEOF
          python3 aplicar_parches.py

      - name: 🚀 Iniciar compilación definitiva
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/CODIGO
        run: buildozer android debug --no-warmup --verbose

      - name: 📤 Guardar APK listo
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GestorMasterS-UNIVERSAL-v1.0.0-Seguro
          path: bin/*.apk
          retention-days: 90
