name: Compile GestorMasterS
run-name: Build ${{ github.actor }} · ${{ github.sha }}

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_UNSECURE_NODE_VERSION: true
  PYTHONIOENCODING: utf-8
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_LICENSE_ACCEPTED: true
      CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python exact version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Cache build directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: ${{ runner.os }}-buildozer-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config libssl-dev libffi-dev cmake

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cryptography python-for-android==2024.10.9

      - name: Apply all required fixes
        run: |
          # Fix zlib check
          sed -i 's/if not self.buildozer.file_exists('\''\/usr\/include\/zlib.h'\''):/if False: # patched/g' ~/.local/lib/python*/site-packages/buildozer/targets/android.py
          sed -i 's/if not buildops.file_exists('\''\/usr\/include\/zlib.h'\''):/if False: # patched/g' ~/.local/lib/python*/site-packages/buildozer/targets/android.py

          # Fix AIDL and SDK version
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools
          ln -sf ~/.buildozer/android/platform/android-sdk/build-tools/30.0.3 ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0 || true

          # Fix zip / ioctl error
          sed -i 's/zip -r/zip -rq/g' ~/.local/lib/python*/site-packages/buildozer/targets/android.py
          sed -i 's/subprocess.call(\[\"zip\"/subprocess.call(\[\"zip\", \"-q\"/g' ~/.local/lib/python*/site-packages/buildozer/targets/android.py
          stty sane || true

      - name: Run build
        run: |
          buildozer android debug --no-warmup --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GestorMasterS-APK
          path: bin/*.apk
