name: Build APK DEFINITIVO
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip build-essential libffi-dev libssl-dev autoconf automake libtool
          sudo apt-get install -y pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo-dev cmake

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --user Cython==0.29.36
          pip install --user buildozer

      - name: Limpiar caché vieja
        run: rm -rf .buildozer bin __pycache__

      - name: Compilar APK
        run: yes | buildozer android debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GestorMasterS-APK-FINAL
          path: bin/*.apk
