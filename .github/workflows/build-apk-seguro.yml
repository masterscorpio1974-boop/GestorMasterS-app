name: Build APK DEFINITIVO
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip build-essential libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev cmake
      - run: |
          pip install Cython==0.29.36 buildozer
          rm -rf.buildozer
      - run: |
          yes | buildozer android debug --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS-APK
          path: bin/*.apk
