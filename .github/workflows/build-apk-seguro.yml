name: Build APK - Gestor Master S

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Dependencias del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev unp zip unzip
          sudo apt-get install -y pipexec libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer cython virtualenv

      - name: Instalar Android NDK y SDK de Respaldo
        run: |
          mkdir -p ~/.buildozer/android/platform/
          echo "sdk_dir = ~/.buildozer/android/platform/android-sdk" >> ~/.buildozer/config

      - name: Compilar APK con Buildozer (Forzando Licencias Internas)
        run: |
          # Comando corregido para aceptar licencias usando python-for-android nativo
          yes | buildozer android p4a -- android.accept_sdk_license=True
          # Compilacion limpia
          yes | buildozer android debug
        env:
          BUILDOZER_ALLOW_KIVY_NEW_DESIGN: 1

      - name: Subir APK Generado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS-APK-v2
          path: bin/*.apk
