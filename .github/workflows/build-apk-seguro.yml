name: Build APK DEFINITIVO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            zip unzip build-essential \
            libffi-dev libssl-dev \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libsqlite3-dev

      - name: Instalar Buildozer y Cython
        run: |
          python -m pip install --upgrade pip
          pip install "Cython==0.29.36" buildozer

      - name: Restaurar caché de Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-3.11-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-3.11-

      - name: Limpiar builds viejos
        run: |
          buildozer android clean || true
          rm -rf .buildozer/android/platform/build-*/build/other_builds/python3 || true

      - name: Compilar APK
        run: |
          yes | buildozer android debug --verbose

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS-APK
          path: bin/*.apk
          if-no-files-found: error
