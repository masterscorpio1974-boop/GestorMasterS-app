name: Compile GestorMasterS DEFINITIVO AZUL
run-name: Construyendo ${{ github.actor }} - GestorMasterS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_LICENSE_ACCEPTED: true
      CT: true
      BUILDOZER_ANDROID_SDK_ACCEPT_LICENSE: 1
    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python version exacta
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar paquetes del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip zip libffi-dev libssl-dev autoconf automake libtool openjdk-17-jdk lib32stdc++6 lib32z1
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Configurar estructura oficial de Android SDK Manager
        run: |
          # Crear directorios objetivos base de Buildozer
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          
          # Descargar cmdline-tools oficiales de Android para poblar la ruta esperada
          wget -q https://google.com -O cmdline.zip
          unzip -q cmdline.zip
          
          # Mover los ejecutables binarios indispensables para Buildozer a tools/bin
          cp -r cmdline-tools/bin/* ~/.buildozer/android/platform/android-sdk/tools/bin/
          
          # Inyectar licencias firmadas pre-aprobadas directamente
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n244ac7ae5e2134cc74d480f361f31b8a11e80ffd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n851659751996d669b30329afac260217c21a511b" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          
          # Limpiar archivos temporales de descarga
          rm -rf cmdline.zip cmdline-tools

      - name: Borrar datos de ejecuciones anteriores
        run: |
          rm -rf .buildozer bin __pycache__ *.pyc || true

      - name: Ejecutar compilacion
        run: |
          buildozer android debug --no-warnup --verbose

      - name: Subir el archivo APK final
        uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS-APK-AZUL-CRISTAL
          path: bin/*.apk
          if-no-files-found: error
