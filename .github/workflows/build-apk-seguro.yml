name: Compile GestorMasterS DEFINITIVO AZUL
run-name: Construyendo ${{ github.actor }} • GestorMasterS
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_SDK_LICENSE_ACCEPTED: true
      CI: true
      BUILDOZER_ANDROID_SDK_ACCEPT_LICENSE: 1
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Python exacto
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar todo el sistema
        run: |
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y unzip zip libffi-dev libssl-dev autoconf automake libtool pkg-config
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Aceptar TODAS las licencias SDK de una vez
        run: |
          yes | sdkmanager --licenses || true

      - name: Borrar basura anterior
        run: |
          rm -rf .buildozer bin __pycache__ *.pyc || true

      - name: Compilar APK
        run: |
          buildozer android debug --no-warmup --verbose

      - name: Subir archivo final
        uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS-APK-AZUL-CRISTAL
          path: bin/*.apk
          if-no-files-found: error
