name: Build APK DEFINITIVO
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 1. LO PRIMERO: ACEPTAR LICENCIAS
      - name: Licencias ya aceptadas
        run: |
          rm -rf ~/.android
          mkdir -p ~/.android/sdk/licenses
          echo "24333f8a63b6825ea9c5514f834c281a93b48ca2" > ~/.android/sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c9096d8a34d" > ~/.android/sdk/licenses/android-sdk-preview-license

      # 2. FIJAR EXACTAMENTE Python 3.10, NI UNO MÁS NI MENOS
      - name: Python EXACTO 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Instalar herramientas sistema
      - name: Dependencias
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libsqlite3-dev libbz2-dev liblzma-dev libreadline-dev libgdbm-dev libnss3-dev tk-dev

      # 4. INSTALAR EXACTAMENTE LO QUE DICE TU .spec ANTES DE LLAMAR A BUILDOZER
      - name: Versiones EXACTAS iguales al spec
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.37 buildozer==1.5.0 kivy==2.3.0

      # 5. Compilar --clean para que no use nada viejo
      - name: Compilar limpio
        run: buildozer android debug --clean

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorMaster_SIN_GOOGLE
          path: bin/*.apk
