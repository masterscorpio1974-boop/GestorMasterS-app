name: Compilar GestorMasterS DEFINITIVO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ACTIONS_ALLOW_UNSECURE_NODE_VERSION: true
    steps:
      - name: Obtener código más reciente
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar herramientas de compilación compatibles
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk wget autoconf=2.71-2 automake libtool pkg-config

      - name: Instalar versiones exactas probadas
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.37 python-for-android==2024.01.21

      - name: Compilar APK y aplicar correcciones internas
        run: |
          buildozer android debug --log-level 2 || true
          RECIPES_DIR="$(python -c "import pythonforandroid.recipes; import os; print(os.path.dirname(pythonforandroid.recipes.__file__))")"
          sed -i 's/^if not exists_zlib:/# if not exists_zlib:/' "$RECIPES_DIR/libzlib/__init__.py" 2>/dev/null || true
          sed -i 's/^    raise SystemExit(1)/#    raise SystemExit(1)/' "$RECIPES_DIR/libzlib/__init__.py" 2>/dev/null || true
          sed -i '/LT_SYS_SYMBOL_USCORE/d' "$RECIPES_DIR/libffi/configure.ac" 2>/dev/null || true
          buildozer android debug --log-level 2

      - name: Guardar APK final
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GestorMasterS-APK-DEFINITIVO
          path: bin/*.apk
          retention-days: 90
