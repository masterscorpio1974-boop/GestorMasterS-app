name: Build GESTOR ROJO Capacitor OFFGRID
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: rm -rf android node_modules package-lock.json
      - run: npm install
      - run: npx @capacitor/cli add android
      - name: Poner mi logo ROJO como icono
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/mipmap-*/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_round.xml
          for d in android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do cp www/icon.png $d/ic_launcher.png; cp www/icon.png $d/ic_launcher_round.png; done
      - run: npx @capacitor/cli sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GestorMasterS-ROJO-APK-OFFGRID
          path: android/app/build/outputs/apk/debug/app-debug.apk
